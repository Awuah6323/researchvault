name: ResearchVault Supabase Keep-Alive

on:
  schedule:
    # Every 4 hours — 6 pings per day keeps the free-tier Supabase database
    # well under the 7-day inactivity pause threshold.
    - cron: '30 */4 * * *'
  workflow_dispatch: # Manual trigger from the GitHub Actions tab

jobs:
  keep-alive:
    name: Supabase Database Keep-Alive Ping
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run keep-alive health check
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || vars.VITE_SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY || secrets.VITE_SUPABASE_KEY || vars.VITE_SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || vars.SUPABASE_KEY }}
          DEPLOYED_URL: ${{ secrets.DEPLOYED_URL || vars.DEPLOYED_URL }}
        run: node scripts/healthCheck.js
