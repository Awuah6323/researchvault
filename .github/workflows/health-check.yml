name: ResearchVault Supabase Health Check

on:
  schedule:
    # Runs 3 times every day at 02:00, 10:00, and 18:00 UTC
    - cron: '0 2,10,18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  health-check:
    name: Execute 3x Daily Supabase Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Supabase Health Check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run test:health
